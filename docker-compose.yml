# Metromaker website only. It creates its rooms on an existing metroserver,
# set with METROSERVER_URL in the .env file.
#
#   cp .env.example .env   # then edit .env
#   docker compose up -d

services:
  metromaker:
    image: ghcr.io/finn-freitag/metromaker:latest
    restart: unless-stopped
    ports:
      - "${METROMAKER_PORT:-3000}:3000"
    environment:
      METROSERVER_URL: ${METROSERVER_URL:?Set METROSERVER_URL in the .env file}
      # Guests connect to the existing server directly unless you override this.
      METROSERVER_PUBLIC_URL: ${METROSERVER_PUBLIC_URL:-${METROSERVER_URL}}
      HOST_NAME: ${HOST_NAME:-Metromaker}
      MAX_ROOMS: ${MAX_ROOMS:-20}
      ROOM_IDLE_MINUTES: ${ROOM_IDLE_MINUTES:-180}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      YTM_LANGUAGE: ${YTM_LANGUAGE:-en}
      YTM_REGION: ${YTM_REGION:-US}
    volumes:
      - metromaker-data:/data

volumes:
  metromaker-data:
